<section class="cont-section"><h2 class="c-headline__h2">GPUから選ぶ</h2></section>
<script>
window.addEventListener('load', () => setTimeout(async () => {
  const data = await (await fetch('/ranking.json')).json();
  document.querySelectorAll('li.get_ranking_data[data-ranking]').forEach((box) => {
    const d = (data[box.dataset.categoryname] || [])[Number(box.dataset.ranking) - 1]; if (!d) return;
    box.querySelectorAll('[data-key]').forEach((e) => {
      const k = e.dataset.key, v = d[k];
      if (v == null) return;
      if (k === 'primeurl') e.setAttribute('href', v);
      else if (k === 'primeimgurl') e.setAttribute('src', v);
      else e.textContent = v;
    });
  });
  setTimeout(() => document.querySelectorAll('.js-smbc-box-note').forEach((b) => {
    const amt = Number(b.closest('li').querySelector('.main_price').textContent.replace(/,/g, ''));
    const m = Math.floor(amt / 36 / 100) * 100;
    b.innerHTML = `<span class="smbc_item_price" style="display:none;">${amt}</span><p class="smbc-item">月々<span class="SmbcAuto" data-format="{installmentAmt}">${m.toLocaleString()}</span>円(税込/<span class="SmbcAuto" data-format="{installment}回">36回</span>払い)</p>`;
  }), 1200);
}, 2000));
</script></body></html>
