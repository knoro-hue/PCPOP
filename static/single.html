<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>個別POP</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="single.css">
</head>
<body>
<aside class="panel">
  <nav class="tabs"><a href="/">ランキングPOP</a><a href="/single.html" class="on">個別POP</a></nav>

  <section>
    <label class="lbl" for="url">ドスパラ商品URL</label>
    <div class="row">
      <input id="url" type="url" placeholder="https://www.dospara.co.jp/TC30/MC19364-SN5020.html">
      <button id="btnFetch" class="primary">取得</button>
    </div>
    <details id="pasteBox">
      <summary>取得できない場合: ページのソースを貼り付け</summary>
      <p class="hint">ブラウザで商品ページを開き、Ctrl+U →Ctrl+A →Ctrl+C で貼り付けてください。</p>
      <textarea id="html" rows="5" placeholder="&lt;!DOCTYPE html&gt; ..."></textarea>
      <button id="btnParse">貼り付けたHTMLを解析</button>
    </details>
    <div id="status" class="status"></div>
  </section>

  <div id="editor" hidden>
    <section>
      <h2>表示項目</h2>
      <label><input type="checkbox" id="optGames" checked> ゲーム性能</label>
      <label><input type="checkbox" id="optPorts" checked> 端子形状</label>
      <label><input type="checkbox" id="optInstall" checked> 三井住友分割払（月々）</label>
      <label><input type="checkbox" id="optSpec" checked> 仕様（Wi-Fi・LAN・サイズ・重量）</label>
      <label><input type="checkbox" id="optWarranty" checked> 持込修理保証</label>
      <label><input type="checkbox" id="optBanner" checked> 分割手数料0円バナー</label>
      <label><input type="checkbox" id="optBadge" checked> 即納（出荷目安）</label>
    </section>

    <section>
      <h2>ゲーム性能の表</h2>
      <p class="hint" id="gamesHint"></p>
      <div class="row">
        <button id="btnGamesFps" type="button">fps表（FHD / 4K）</button>
        <button id="btnGamesMark" type="button">3DMarkスコア</button>
      </div>
      <div id="fpsBox" hidden>
        <label class="lbl" style="margin-top:8px">画質
          <select id="fpsQuality"><option value="最高" selected>最高</option><option value="中">中</option></select></label>
        <div id="fpsRes" class="inline-checks">解像度：
          <label><input type="checkbox" value="FHD" checked> FHD</label>
          <label><input type="checkbox" value="WQHD"> WQHD</label>
          <label><input type="checkbox" value="4K" checked> 4K</label>
        </div>
        <div class="lbl" style="font-size:13px">ゲーム（5本まで）</div>
        <div id="fpsGames" class="fps-games"></div>
      </div>
      <p class="hint">表の文字・数字はPOP上で直接クリックして入力・修正できます。</p>
    </section>

    <section>
      <h2>PC画像</h2>
      <div id="thumbs" class="thumbs"></div>
    </section>

    <section>
      <h2>取得データ確認（製品仕様［基本構成］全項目）</h2>
      <table id="rawTable" class="raw"></table>
    </section>

    <section class="sticky">
      <button id="btnPrint" class="primary wide">印刷 / PDF保存 (A4)</button>
    </section>
  </div>
</aside>

<main class="stage">
  <div id="pop" class="pop empty">
    <p class="placeholder">URLを入力して「取得」を押すとPOPが表示されます</p>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
